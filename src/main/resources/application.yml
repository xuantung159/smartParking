spring:
  application:
    name: parking
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/parking?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD}
  # Tạo bảng và nạp dữ liệu mẫu từ db/schema.sql, db/data.sql mỗi lần khởi động.
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Ít nhất 32 ký tự. Để trống thì mỗi lần khởi động sinh khoá ngẫu nhiên (token cũ mất hiệu lực).
    secret: ${JWT_SECRET:}
    expires-in: ${JWT_EXPIRES_IN:3600} # giây
